name: fork-build

# Fork-only release pipeline. Upstream's build jobs target Blacksmith runners and the `dev` branch,
# which are not available in this fork, so this workflow builds the Windows CLI on a GitHub-hosted
# runner and publishes it as an installable npm package on the release page.
#
# Install/update (see the fork section in README.md):
#   npm i -g https://github.com/vibed-this/opencode-x/releases/latest/download/opencode-x.tgz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Stamp the binary like a release so it can replace an npm install in place: channel `latest`
      # keeps the database file, service registration, and TUI storage on the standard paths.
      OPENCODE_VERSION: "2.1.3"
      OPENCODE_CHANNEL: "latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Shell tests
        working-directory: packages/core
        run: |
          bun test test/shell.test.ts
          bun test test/tool-shell.test.ts -t "non-ASCII"

      - name: Build CLI
        working-directory: packages/cli
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run script/build.ts --single --skip-install

      - name: Report binary
        working-directory: packages/cli
        run: |
          ls -l dist/cli-windows-x64/bin
          ./dist/cli-windows-x64/bin/opencode.exe --version

      # A package whose `bin` points straight at the compiled executable needs no launcher or
      # postinstall, and npm links it like any other global CLI.
      - name: Package npm tarball
        working-directory: packages/cli
        run: |
          pkg=dist/npm/opencode-x
          mkdir -p "$pkg/bin"
          cp dist/cli-windows-x64/bin/opencode.exe "$pkg/bin/opencode.exe"
          printf '{"name":"opencode-x","version":"%s","description":"OpenCode fork with UTF-8 shell output on Windows","license":"MIT","repository":{"type":"git","url":"git+https://github.com/vibed-this/opencode-x.git"},"os":["win32"],"cpu":["x64"],"bin":{"opencode":"./bin/opencode.exe","opencode-x":"./bin/opencode.exe"},"files":["bin/opencode.exe"]}\n' \
            "$OPENCODE_VERSION" > "$pkg/package.json"
          cd "$pkg"
          npm pack --pack-destination ..
          mv "../opencode-x-$OPENCODE_VERSION.tgz" ../opencode-x.tgz
          ls -l ../opencode-x.tgz

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64
          path: packages/cli/dist/cli-windows-x64/**
          if-no-files-found: error
          retention-days: 7

      # `/releases/latest/download/<asset>` only works when the release is the latest one, and the
      # asset name stays constant so the install command never changes between versions.
      - name: Publish release
        working-directory: packages/cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$OPENCODE_VERSION-x"
          gh release view "$tag" > /dev/null 2>&1 ||
            gh release create "$tag" \
              --title "opencode $OPENCODE_VERSION (Windows UTF-8 fork build)" \
              --notes "Windows x64 build of opencode $OPENCODE_VERSION with the fix for mojibake in shell tool output (\`packages/core/src/shell/select.ts\`). Install or update with \`npm i -g https://github.com/vibed-this/opencode-x/releases/latest/download/opencode-x.tgz\`." \
              --latest
          gh release upload "$tag" dist/npm/opencode-x.tgz --clobber
